name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      # The methodologies are authored data, not code. A bad edit should fail
      # the build rather than an engagement.
      - name: Validate shipped methodologies
        run: |
          python -c "
          from infrastructure.methodologies.json_methodology_repository import (
              JsonMethodologyRepository,
          )
          repository = JsonMethodologyRepository()
          for methodology in repository.all():
              methodology.validate()
              print(f'{methodology.key}: ok')
          "
