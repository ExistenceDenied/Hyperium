name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# These are Windows apps (start.bat, OneDrive-aware file handling), so CI runs
# on windows-latest to match the environment they're developed and run in.
jobs:
  admin-finance:
    name: admin-finance (TypeScript)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/admin-finance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node >= 21 required: @af/core's test script passes a glob
          # (node --test test/*.test.ts), which the test runner only expands
          # from 21 onward. Match the app's local runtime (24).
          node-version: 24
          cache: npm
          cache-dependency-path: apps/admin-finance/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  hyperium-ai:
    name: hyperium-ai (Python)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/hyperium-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,office]"
      - run: pytest -q
