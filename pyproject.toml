[project]
name = "hyperium"
version = "0.2.0"
description = "An AI Consultancy Operating System."
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
hyperium = "interfaces.cli:main"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
